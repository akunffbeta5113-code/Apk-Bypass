name: Build Bypass APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cordova platform add android@13.0.0

      - name: Create keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > bypass-release.keystore

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npx cordova build android --release \
            -- \
            --keystore=../bypass-release.keystore \
            --storePassword="$KEYSTORE_PASSWORD" \
            --alias="$KEY_ALIAS" \
            --password="$KEY_PASSWORD"

      - name: Find APK
        run: |
          APK=$(find platforms/android -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan!"
            find platforms/android -type f | sort
            exit 1
          fi

          echo "APK ditemukan: $APK"
          cp "$APK" BYPASS-APP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BYPASS-APP
          path: BYPASS-APP.apk
          if-no-files-found: error
